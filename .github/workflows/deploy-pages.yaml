name: Deploy GitHub Pages (from built image artifact)

on:
  workflow_run:
    workflows: ["Build Docker image artifact"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-export
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Publish your src/index.html as the site root page
      - name: Add site index.html
        run: |
          mkdir -p site
          cp src/index.html site/index.html
        shell: bash

      # IMPORTANT: The deploy job doesn't automatically have your repo files.
      # So we need to checkout to access src/index.html.
      - name: Checkout (for src/index.html)
        uses: actions/checkout@v4

      - name: Copy src/index.html to site root
        run: |
          cp src/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4