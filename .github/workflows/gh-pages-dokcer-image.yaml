name: Build Docker image and publish to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image locally in the runner (no registry push needed)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/hello:pages

      # Export the built image to an OCI layout (static files) that we can host on Pages
      - name: Export image to OCI layout
        run: |
          mkdir -p dist/images/hello
          docker image save local/hello:pages -o /tmp/hello.tar
          tar -xf /tmp/hello.tar -C dist/images/hello

      # Put your HTML at the site root too
      - name: Stage site files
        run: |
          mkdir -p dist
          cp index.html dist/index.html

          cat > dist/README.txt <<'EOF'
          This site includes:
          - /index.html
          - /images/hello/  (docker image saved as static files from `docker save`)
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4